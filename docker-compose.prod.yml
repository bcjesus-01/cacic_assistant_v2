services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/cacic_db
      QDRANT_URL: http://qdrant:6333
    volumes:
      # Cache dos modelos do Hugging Face: evita baixar o bge-m3 (~2 GB) a cada rebuild.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - cacic_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vazio de propósito: o Caddy expõe a API no mesmo host em /api/*, então a URL fica
        # relativa (/api/v1/chat/stream) e nunca precisa de CORS.
        NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cacic_network

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - cacic_network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cacic_db
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cacic_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - cacic_network

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - cacic_network

volumes:
  hf_cache:
  caddy_data:
  caddy_config:

networks:
  cacic_network:
    driver: bridge
