name: Inspeção de Código (CI)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      # A versão do Python vem do arquivo backend/.python-version (3.12)
      - name: Instalar dependências (versões travadas no uv.lock)
        run: uv sync --frozen

      - name: Lint com Ruff
        run: uvx ruff@0.16.9 check .

      # pytest é instalado só para esta execução (não altera o uv.lock)
      - name: Testes (pytest)
        run: uv run --frozen --with pytest pytest -q

      - name: Verificar sintaxe
        run: uv run python -m compileall -q main.py agent api etl_pipeline.py adicionar_docs.py curados.py eval
