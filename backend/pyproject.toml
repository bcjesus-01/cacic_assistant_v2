[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bruno", email = "bcjesus.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.4.1",
    "langchain-huggingface>=1.2.3",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "llama-parse>=0.6.94",
    "psycopg>=3.3.6",
    "psycopg-pool>=3.3.3",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "sse-starlette>=3.5.0",
    "torch>=2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# O servidor de produção não tem GPU; a versão padrão do PyTorch traz ~4GB de pacotes
# nvidia-* (CUDA) que nunca são usados e já causaram falta de espaço em disco no deploy.
# A versão CPU-only é equivalente em funcionalidade pro que o projeto usa (embeddings
# bge-m3 via sentence-transformers, sempre em CPU aqui) e ordens de magnitude menor.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
