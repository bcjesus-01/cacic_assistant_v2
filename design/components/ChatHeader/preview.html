<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatHeader · preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="cacic-hex" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--coral)"/><stop offset="0.55" style="stop-color:var(--magenta)"/><stop offset="1" style="stop-color:var(--violet)"/></linearGradient></defs></svg>
<div class="cacic-stage cacic-stage--grid" style="padding:0">
  <div class="cacic-spec" style="padding-top:var(--space-4)"><span class="cacic-spec__tag" style="padding-left:var(--space-6)">Desktop</span><header class="cacic-header">
  <div class="cacic-header__id"><img class="cacic-logo" src="/_blob/e907c2059dbf9310acadaac91527eae6" alt="CACIC"></div>
  <span class="cacic-handle">@cacicuesc</span>
  <span class="cacic-dots" aria-hidden="true"></span>
  <span class="cacic-status">Online</span>
  <button class="cacic-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nova conversa</button>
</header></div>
  <div class="cacic-spec" style="max-width:390px"><span class="cacic-spec__tag" style="padding-left:var(--space-4)">Celular</span><header class="cacic-header">
  <img class="cacic-logo" src="/_blob/e907c2059dbf9310acadaac91527eae6" alt="CACIC">
  <div class="cacic-header__id" style="flex:1;flex-direction:column;align-items:flex-start;gap:0">
    <h1 class="cacic-header__title">Assistente CACIC</h1>
    <span class="cacic-status">Online</span>
  </div>
  <button class="cacic-icon-btn cacic-icon-btn--lg" type="button" aria-label="Nova conversa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</header></div>
</div>
</body>
</html>
